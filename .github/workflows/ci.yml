name: Selective target checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild and retest every registered target
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: selective-targets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository and CI regression tests
        run: make check

  plan:
    name: selective-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.planner.outputs.matrix }}
      has_targets: ${{ steps.planner.outputs.has_targets }}
      plan_sha256: ${{ steps.planner.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select targets and calculate fingerprints
        id: planner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          FULL: ${{ inputs.full || false }}
        run: |
          if [ "$FULL" = "true" ]; then
            set -- --full
          else
            set --
          fi
          python3 tools/ci_pipeline.py plan \
            --base "$BASE_SHA" \
            --platform ubuntu-24.04-x86_64 \
            --output ci-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "$@"

  verify-targets:
    name: target-${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore build by exact fingerprint
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ matrix.project }}/build
          key: jr200-build-v1-${{ matrix.platform }}-${{ matrix.id }}-${{ matrix.build_fingerprint }}
          lookup-only: false

      - name: Validate restored build and artifact hash
        id: build-valid
        continue-on-error: true
        run: >-
          python3 tools/ci_pipeline.py cache-check
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"

      - name: Restore successful test receipt by exact fingerprint
        id: receipt-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ci-cache/receipts/${{ matrix.id }}
          key: jr200-receipt-v1-${{ matrix.platform }}-${{ matrix.id }}-${{ matrix.test_fingerprint }}
          lookup-only: false

      - name: Validate receipt against restored artifact
        id: receipt-valid
        continue-on-error: true
        run: >-
          python3 tools/ci_pipeline.py receipt-check
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Check out locked external jrasm source when rebuild is required
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ypsitau/jrasm
          ref: 45d0ba18aed74bf09465db5dde3933618ae0b314
          path: .external/jrasm
          persist-credentials: false

      - name: Build and verify external jrasm when rebuild is required
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        env:
          JRASM: ${{ github.workspace }}/.external/jrasm/build/src/jrasm/jrasm
        run: |
          python3 tools/build_jrasm.py --source .external/jrasm
          make jrasm-check

      - name: Build target when no valid artifact is reusable
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        env:
          JRASM: ${{ github.workspace }}/.external/jrasm/build/src/jrasm/jrasm
        run: >-
          python3 tools/ci_pipeline.py build
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --jrasm "$JRASM"

      - name: Test target unless an exact successful receipt is reusable
        if: steps.receipt-valid.outcome != 'success'
        run: >-
          python3 tools/ci_pipeline.py test
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Create receipt only after target tests pass
        if: steps.receipt-valid.outcome != 'success'
        run: >-
          python3 tools/ci_pipeline.py receipt-write
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Save verified build on main only
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.receipt-valid.outcome != 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ matrix.project }}/build
          key: jr200-build-v1-${{ matrix.platform }}-${{ matrix.id }}-${{ matrix.build_fingerprint }}

      - name: Save successful receipt on main only
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.receipt-valid.outcome != 'success' && steps.receipt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ci-cache/receipts/${{ matrix.id }}
          key: jr200-receipt-v1-${{ matrix.platform }}-${{ matrix.id }}-${{ matrix.test_fingerprint }}

      - name: Summarize target decision
        if: always()
        run: |
          {
            echo "## Target ${{ matrix.id }}"
            echo
            echo "- Reason: ${{ matrix.reason }}"
            echo "- Source/build input changed: ${{ matrix.build_required }}"
            echo "- Build cache validation: ${{ steps.build-valid.outcome }}"
            echo "- Full receipt validation: ${{ steps.receipt-valid.outcome }}"
            echo "- Emulator verification: not_run"
            echo "- Hardware verification: not_run"
          } >> "$GITHUB_STEP_SUMMARY"

  required-gate:
    name: required-gate
    needs: [repository-contracts, plan, verify-targets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject planner, target, failure, cancellation, or unexpected skip
        env:
          REQUIRED_RESULT: ${{ needs.repository-contracts.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TARGETS_RESULT: ${{ needs.verify-targets.result }}
          HAS_TARGETS: ${{ needs.plan.outputs.has_targets || 'false' }}
        run: >-
          python3 tools/ci_pipeline.py gate
          --required-result "$REQUIRED_RESULT"
          --plan-result "$PLAN_RESULT"
          --targets-result "$TARGETS_RESULT"
          --has-targets "$HAS_TARGETS"
