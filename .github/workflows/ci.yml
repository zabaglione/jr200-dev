name: Selective target checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild and retest every registered target
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: selective-targets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository and CI regression tests
        run: make check

  plan:
    name: selective-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.planner.outputs.matrix }}
      has_targets: ${{ steps.planner.outputs.has_targets }}
      plan_sha256: ${{ steps.planner.outputs.plan_sha256 }}
      trusted_run_id: ${{ steps.trusted.outputs.trusted_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch latest successful main snapshot
        id: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_snapshot.py download
          --output .ci-cache/trusted-state
          --github-output "$GITHUB_OUTPUT"
      - name: Select targets and calculate fingerprints
        id: planner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          FULL: ${{ inputs.full || false }}
        run: |
          if [ "$FULL" = "true" ]; then
            set -- --full
          else
            set --
          fi
          python3 tools/ci_pipeline.py plan \
            --base "$BASE_SHA" \
            --platform ubuntu-24.04-x86_64 \
            --output ci-plan.json \
            --trusted-state .ci-cache/trusted-state \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "$@"

  verify-targets:
    name: target-${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    cache-mode: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch prior trusted snapshot
        if: needs.plan.outputs.trusted_run_id != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_RUN_ID: ${{ needs.plan.outputs.trusted_run_id }}
        run: >-
          python3 tools/ci_snapshot.py download
          --run-id "$TRUSTED_RUN_ID"
          --output .ci-cache/trusted-state

      - name: Restore validated target snapshot when compatible
        run: >-
          python3 tools/ci_snapshot.py restore
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Validate restored build and artifact hash
        id: build-valid
        continue-on-error: true
        run: >-
          python3 tools/ci_pipeline.py cache-check
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"

      - name: Validate receipt against restored artifact
        id: receipt-valid
        continue-on-error: true
        run: >-
          python3 tools/ci_pipeline.py receipt-check
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Check out locked external jrasm source when rebuild is required
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ypsitau/jrasm
          ref: 45d0ba18aed74bf09465db5dde3933618ae0b314
          path: .external/jrasm
          persist-credentials: false

      - name: Build and verify external jrasm when rebuild is required
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        env:
          JRASM: ${{ github.workspace }}/.external/jrasm/build/src/jrasm/jrasm
        run: |
          python3 tools/build_jrasm.py --source .external/jrasm
          make jrasm-check

      - name: Build target when no valid artifact is reusable
        if: steps.receipt-valid.outcome != 'success' && steps.build-valid.outcome != 'success'
        env:
          JRASM: ${{ github.workspace }}/.external/jrasm/build/src/jrasm/jrasm
        run: >-
          python3 tools/ci_pipeline.py build
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --jrasm "$JRASM"

      - name: Test target unless an exact successful receipt is reusable
        if: steps.receipt-valid.outcome != 'success'
        run: >-
          python3 tools/ci_pipeline.py test
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Create receipt only after target tests pass
        if: steps.receipt-valid.outcome != 'success'
        run: >-
          python3 tools/ci_pipeline.py receipt-write
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"

      - name: Package verified target for trusted main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          python3 tools/ci_snapshot.py package
          --target "${{ matrix.id }}"
          --platform "${{ matrix.platform }}"
          --build-fingerprint "${{ matrix.build_fingerprint }}"
          --test-fingerprint "${{ matrix.test_fingerprint }}"
          --output ".ci-cache/snapshot-entry/${{ matrix.id }}"

      - name: Upload target result on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-${{ matrix.id }}
          path: .ci-cache/snapshot-entry/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

      - name: Summarize target decision
        if: always()
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_REASON: ${{ matrix.reason }}
          BUILD_REQUIRED: ${{ matrix.build_required }}
          BUILD_OUTCOME: ${{ steps.build-valid.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt-valid.outcome }}
        run: |
          {
            printf '## Target %s\n' "$TARGET_ID"
            echo
            printf '%s\n' "- Reason: $TARGET_REASON"
            printf '%s\n' "- Source/build input changed: $BUILD_REQUIRED"
            printf '%s\n' "- Build artifact validation: $BUILD_OUTCOME"
            printf '%s\n' "- Full receipt validation: $RECEIPT_OUTCOME"
            echo "- Emulator verification: not_run"
            echo "- Hardware verification: not_run"
          } >> "$GITHUB_STEP_SUMMARY"

  trusted-snapshot:
    name: trusted-snapshot
    needs: [repository-contracts, plan, verify-targets]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.repository-contracts.result == 'success' && needs.plan.result == 'success' &&
      (needs.verify-targets.result == 'success' ||
       (needs.plan.outputs.has_targets == 'false' && needs.verify-targets.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch prior trusted snapshot
        if: needs.plan.outputs.trusted_run_id != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_RUN_ID: ${{ needs.plan.outputs.trusted_run_id }}
        run: >-
          python3 tools/ci_snapshot.py download
          --run-id "$TRUSTED_RUN_ID"
          --output .ci-cache/trusted-state
      - name: Assemble verified snapshot of all current targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: >-
          python3 tools/ci_snapshot.py assemble
          --run-id "$CURRENT_RUN_ID"
          --selected-json "$SELECTED_MATRIX"
          --output .ci-cache/trusted-output
      - name: Upload trusted main snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-targets-v1
          path: .ci-cache/trusted-output
          if-no-files-found: error
          retention-days: 90

  required-gate:
    name: required-gate
    needs: [repository-contracts, plan, verify-targets, trusted-snapshot]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject planner, target, failure, cancellation, or unexpected skip
        env:
          REQUIRED_RESULT: ${{ needs.repository-contracts.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TARGETS_RESULT: ${{ needs.verify-targets.result }}
          HAS_TARGETS: ${{ needs.plan.outputs.has_targets || 'false' }}
          SNAPSHOT_RESULT: ${{ needs.trusted-snapshot.result }}
          SNAPSHOT_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: >-
          python3 tools/ci_pipeline.py gate
          --required-result "$REQUIRED_RESULT"
          --plan-result "$PLAN_RESULT"
          --targets-result "$TARGETS_RESULT"
          --has-targets "$HAS_TARGETS"
          --snapshot-result "$SNAPSHOT_RESULT"
          --snapshot-required "$SNAPSHOT_REQUIRED"
